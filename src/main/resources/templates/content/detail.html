<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Content Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="fw-bold" th:text="${contentItem.title}">Title</h2>
            <span class="badge bg-primary" th:text="${contentItem.category}">ACADEMIC</span>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/content}">Back</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body" th:with="summary=${reactionSummary}">
            <div class="ratio ratio-21x9 mb-3" th:if="${contentItem.imageUrl}">
                <img th:src="${contentItem.imageUrl}" class="img-fluid object-fit-cover rounded" alt="Content banner">
            </div>
            <p class="lead" th:text="${contentItem.description}">Description</p>
            <div th:if="${contentItem.additionalInfo}" class="mt-3">
                <h6>Additional Information</h6>
                <p th:text="${contentItem.additionalInfo}">Additional</p>
            </div>
            <a class="btn btn-primary mt-3" th:if="${contentItem.ctaLink}" th:href="${contentItem.ctaLink}" target="_blank" rel="noopener">Open Linked Resource</a>
            <div class="d-flex gap-2 mt-4">
                <form th:action="@{|/content/${contentItem.id}/react|}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="type" value="LIKE">
                    <button class="btn"
                            th:classappend="${summary != null and summary.userReaction == T(lk.nsbm.university.entity.ContentReactionType).LIKE} ? 'btn-success' : 'btn-outline-success'">
                        👍 Liked (<span th:text="${summary != null ? summary.likes : 0}">0</span>)
                    </button>
                </form>
                <form th:action="@{|/content/${contentItem.id}/react|}" method="post" class="m-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="type" value="DISLIKE">
                    <button class="btn"
                            th:classappend="${summary != null and summary.userReaction == T(lk.nsbm.university.entity.ContentReactionType).DISLIKE} ? 'btn-danger' : 'btn-outline-danger'">
                        👎 Disliked (<span th:text="${summary != null ? summary.dislikes : 0}">0</span>)
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
