<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Content CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Content Management</h2>
            <p class="text-muted mb-0">Publish content for academic and student services.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Create Content</h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-info small" th:if="${primaryCategory != null}">
                        You are limited to publishing under the <strong th:text="${primaryCategory}">category</strong> category.
                    </div>
                    <form th:action="@{/content/manage}" th:object="${contentForm}" method="post" class="row g-3" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{imageUrl}">
                        <div class="col-12">
                            <label class="form-label">Title</label>
                            <input class="form-control" th:field="*{title}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{category}" required>
                                <option value="">Select</option>
                                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="4" th:field="*{description}" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Additional Info</label>
                            <textarea class="form-control" rows="2" th:field="*{additionalInfo}"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Hero Image</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Action Link / WhatsApp URL</label>
                            <input class="form-control" th:field="*{ctaLink}" placeholder="https://wa.me/...">
                        </div>
                        <div class="col-12 d-grid">
                            <button class="btn btn-success" type="submit">Publish</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Published Entries</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Last Updated</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${contentPage.content}">
                                <td th:text="${item.title}">Title</td>
                                <td th:text="${item.category}">Category</td>
                                <td th:text="${#temporals.format(item.updatedAt, 'dd MMM yyyy HH:mm')}">Date</td>
                                <td>
                                    <form th:action="@{|/content/manage/${item.id}/update|}" method="post" class="row g-2" enctype="multipart/form-data">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="imageUrl" th:value="${item.imageUrl}">
                                        <div class="col-md-12">
                                            <input class="form-control form-control-sm" name="title" th:value="${item.title}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <select class="form-select form-select-sm" name="category" required>
                                                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}" th:selected="${category == item.category}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <input class="form-control form-control-sm" name="additionalInfo" th:value="${item.additionalInfo}">
                                        </div>
                                        <div class="col-md-6">
                                            <input class="form-control form-control-sm" name="ctaLink" th:value="${item.ctaLink}" placeholder="Action link">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small mb-1">Replace Image</label>
                                            <input type="file" class="form-control form-control-sm" name="imageFile" accept="image/*">
                                        </div>
                                        <div class="col-12">
                                            <textarea class="form-control form-control-sm" name="description" rows="2" th:text="${item.description}" required></textarea>
                                        </div>
                                        <div class="col-12">
                                            <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
                                        </div>
                                    </form>
                                    <form class="mt-2" th:action="@{|/content/manage/${item.id}/delete|}" method="post" data-confirm="Delete this content entry?">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${contentPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{|/content/manage?page=${contentPage.number-1}&size=${contentPage.size}|}">Previous</a>
                            </li>
                            <li class="page-item disabled"><span class="page-link">Page <span th:text="${contentPage.number + 1}">1</span> / <span th:text="${contentPage.totalPages}">1</span></span></li>
                            <li class="page-item" th:classappend="${contentPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{|/content/manage?page=${contentPage.number+1}&size=${contentPage.size}|}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
