<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | University Services</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mb-4">
        <div>
            <h2 class="fw-bold">University Services & Experiences</h2>
            <p class="text-muted mb-0">Explore academic resources, clubs, shuttles, and boarding details.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="alert alert-info" th:if="${selectedCategory != null}">
        Showing <strong th:text="${#strings.capitalize(selectedCategory.name().toLowerCase())}">CATEGORY</strong> services.
        <a class="ms-2" th:href="@{/content}">Clear filter</a>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-sm"
           th:each="category : ${categories}"
           th:classappend="${category == selectedCategory} ? 'btn-primary' : 'btn-outline-primary'"
           th:text="${#strings.capitalize(category.name().toLowerCase())}"
           th:href="@{/content(category=${category.name()})}">
        </a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/content}">All services</a>
    </div>

    <form class="row g-3 align-items-end mb-4" method="get" th:action="@{/content}">
        <div class="col-md-6">
            <label class="form-label">Category</label>
            <select class="form-select" name="category">
                <option value="" th:selected="${selectedCategory == null}">All categories</option>
                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"
                        th:selected="${category == selectedCategory}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" type="submit">Filter</button>
        </div>
    </form>

    <div class="row g-4">
        <div class="col-md-4" th:each="item : ${contentPage.content}">
            <div class="card h-100 shadow-sm" th:with="summary=${reactionSummaries[item.id]}">
                <div class="ratio ratio-16x9" th:if="${item.imageUrl}">
                    <img th:src="${item.imageUrl}" class="img-fluid object-fit-cover" alt="Service cover">
                </div>
                <div class="card-body d-flex flex-column">
                    <span class="badge bg-secondary mb-2" th:text="${item.category}">ACADEMIC</span>
                    <h5 class="card-title" th:text="${item.title}">Title</h5>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(item.description, 120)}">Summary</p>
                    <div th:if="${item.additionalInfo}" class="small text-muted border-top pt-2" th:text="${item.additionalInfo}"></div>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div class="d-flex gap-2">
                                <form th:action="@{|/content/${item.id}/react|}" method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="type" value="LIKE">
                                        <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${summary != null and summary.userReaction == T(lk.nsbm.university.entity.ContentReactionType).LIKE} ? 'btn-success' : 'btn-outline-success'">
                                        👍 <span class="ms-1" th:text="${summary != null ? summary.likes : 0}">0</span>
                                    </button>
                                </form>
                                <form th:action="@{|/content/${item.id}/react|}" method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="hidden" name="type" value="DISLIKE">
                                        <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${summary != null and summary.userReaction == T(lk.nsbm.university.entity.ContentReactionType).DISLIKE} ? 'btn-danger' : 'btn-outline-danger'">
                                        👎 <span class="ms-1" th:text="${summary != null ? summary.dislikes : 0}">0</span>
                                    </button>
                                </form>
                            </div>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{|/content/${item.id}|}">View</a>
                        </div>
                        <a class="btn btn-sm btn-primary w-100" th:if="${item.ctaLink}" th:href="${item.ctaLink}" target="_blank" rel="noopener">Open Link</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${contentPage.totalElements == 0}" class="col-12">
            <div class="alert alert-info">No content published yet.</div>
        </div>
    </div>

    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${contentPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/content(page=${previousPage},size=${contentPage.size},category=${selectedCategory != null ? selectedCategory.name() : null})}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link">Page <span th:text="${contentPage.number + 1}">1</span> / <span th:text="${contentPage.totalPages}">1</span></span></li>
            <li class="page-item" th:classappend="${contentPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/content(page=${nextPage},size=${contentPage.size},category=${selectedCategory != null ? selectedCategory.name() : null})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
