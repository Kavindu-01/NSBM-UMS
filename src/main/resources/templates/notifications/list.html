<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container-xxl py-5">
    <div class="glass-panel p-4 p-lg-5 mb-4">
        <h2 class="fw-bold mb-1">Notifications</h2>
        <p class="text-white-50 mb-0">All your system and admin notifications.</p>
    </div>
    <div th:replace="fragments/alerts :: alerts"></div>
    <div class="glass-panel">
        <div th:if="${#lists.isEmpty(notifications)}" class="alert alert-info mb-0">
            No notifications yet.
        </div>
        <ul class="list-group list-group-flush" th:if="${!#lists.isEmpty(notifications)}">
            <li class="list-group-item d-flex justify-content-between align-items-start" th:each="note : ${notifications}" th:classappend="${note.isRead} ? 'list-group-item-secondary' : ''">
                <div class="ms-2 me-auto">
                    <div class="fw-bold" th:text="${note.title}">Title</div>
                    <span th:text="${note.message}">Message</span>
                    <div class="small text-white-50 mt-1" th:text="${#temporals.format(note.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</div>
                </div>
                <form th:action="@{|/notifications/mark-read/${note.id}|}" method="post" th:if="${!note.isRead}">
                    <button class="btn btn-sm btn-outline-success" type="submit">Mark as read</button>
                </form>
            </li>
        </ul>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
