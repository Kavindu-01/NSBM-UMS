<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Club Workspace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="text-muted small mb-1">Club Portal</p>
            <h2 class="fw-bold" th:text="${club.name}">Club Name</h2>
            <p class="text-muted" th:text="${club.tagline}">Tagline</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/club/manage}">Back to list</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Club Profile</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{|/club/manage/${club.id}/details|}" method="post" class="row g-3" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="existingCoverImage" th:value="${club.coverImageUrl}">
                        <div class="col-12">
                            <label class="form-label">Tagline</label>
                            <input class="form-control" name="tagline" th:value="${club.tagline}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="4" name="description" th:text="${club.description}"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">WhatsApp Link</label>
                            <input class="form-control" name="whatsappLink" th:value="${club.whatsappLink}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Cover Image</label>
                            <input type="file" class="form-control" name="coverImage" accept="image/*">
                        </div>
                        <div class="col-12 d-grid">
                            <button class="btn btn-primary" type="submit">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Post an Update</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{|/club/manage/${club.id}/posts|}" method="post" class="row g-3" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12">
                            <label class="form-label">Title</label>
                            <input class="form-control" name="title" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="4" name="content" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Image (optional)</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*">
                        </div>
                        <div class="col-12 d-grid">
                            <button class="btn btn-success" type="submit">Publish</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Recent Posts</h5>
                </div>
                <div class="card-body" th:if="${posts.totalElements == 0}">
                    <p class="text-muted small mb-0">No posts yet. Start sharing announcements to engage your members.</p>
                </div>
                <div class="list-group list-group-flush" th:if="${posts.totalElements > 0}">
                    <div class="list-group-item" th:each="post : ${posts.content}">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="fw-semibold mb-0" th:text="${post.title}">Post</h6>
                                <p class="text-muted small mb-1" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}">Date</p>
                            </div>
                            <a class="btn btn-link text-decoration-none" th:if="${post.imageUrl != null}" th:href="${post.imageUrl}" target="_blank">Image</a>
                        </div>
                        <p class="mb-0" th:text="${post.content}">Body</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
