<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Club Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <h2 class="fw-bold mb-3">Your Clubs</h2>
    <div th:if="${#lists.isEmpty(managedClubs)}" class="alert alert-warning">
        Your account is not assigned to any club yet. Contact an administrator.
    </div>
    <div class="row g-3">
        <div class="col-md-6" th:each="club : ${managedClubs}">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${club.name}">Club</h5>
                    <p class="text-muted flex-grow-1" th:text="${club.tagline}">Tagline</p>
                    <a class="btn btn-primary align-self-start" th:href="@{|/club/manage/${club.id}|}">Open Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
