<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Timetable CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Timetable Management</h2>
            <p class="text-muted mb-0">Plan lectures, labs, and cohort schedules.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Create Entry</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/timetables}" th:object="${timetableForm}" method="post" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12">
                            <label class="form-label">Title</label>
                            <input class="form-control" th:field="*{title}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Subject</label>
                            <input class="form-control" th:field="*{subject}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Day of Week</label>
                            <input class="form-control" th:field="*{dayOfWeek}" placeholder="Monday" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Time Slot</label>
                            <input class="form-control" th:field="*{timeSlot}" placeholder="08:00-10:00" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Batch</label>
                            <select class="form-select" name="batchId" required>
                                <option value="">Select</option>
                                <option th:each="batch : ${batches}" th:value="${batch.id}" th:text="${batch.name}"></option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Semester</label>
                            <select class="form-select" name="semesterId" required>
                                <option value="">Select</option>
                                <option th:each="semester : ${semesters}" th:value="${semester.id}" th:text="${semester.name}"></option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Lecturer</label>
                            <input class="form-control" th:field="*{lecturer}">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Location</label>
                            <input class="form-control" th:field="*{location}">
                        </div>
                        <div class="col-12 d-grid">
                            <button class="btn btn-success" type="submit">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Existing Entries</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Title</th>
                                <th>Batch / Semester</th>
                                <th>Schedule</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${timetablePage.content}">
                                <td>
                                    <strong th:text="${entry.title}">Title</strong>
                                    <p class="small mb-0" th:text="${entry.subject}">Subject</p>
                                </td>
                                <td>
                                    <span th:text="${entry.batch != null ? entry.batch.name : 'N/A'}">Batch</span><br>
                                    <span class="text-muted" th:text="${entry.semester != null ? entry.semester.name : 'N/A'}">Semester</span>
                                </td>
                                <td>
                                    <span th:text="${entry.dayOfWeek}">Monday</span><br>
                                    <span class="text-muted" th:text="${entry.timeSlot}">08:00-10:00</span>
                                </td>
                                <td>
                                    <form th:action="@{|/timetables/${entry.id}/update|}" method="post" class="row g-2">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <div class="col-12">
                                            <input class="form-control form-control-sm" name="title" th:value="${entry.title}" required>
                                        </div>
                                        <div class="col-6">
                                            <input class="form-control form-control-sm" name="subject" th:value="${entry.subject}" required>
                                        </div>
                                        <div class="col-6">
                                            <input class="form-control form-control-sm" name="dayOfWeek" th:value="${entry.dayOfWeek}" required>
                                        </div>
                                        <div class="col-6">
                                            <input class="form-control form-control-sm" name="timeSlot" th:value="${entry.timeSlot}" required>
                                        </div>
                                        <div class="col-6">
                                            <input class="form-control form-control-sm" name="lecturer" th:value="${entry.lecturer}">
                                        </div>
                                        <div class="col-6">
                                            <select class="form-select form-select-sm" name="batchId" required>
                                                <option th:each="batch : ${batches}" th:value="${batch.id}" th:text="${batch.name}" th:selected="${entry.batch != null and batch.id == entry.batch.id}"></option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <select class="form-select form-select-sm" name="semesterId" required>
                                                <option th:each="semester : ${semesters}" th:value="${semester.id}" th:text="${semester.name}" th:selected="${entry.semester != null and semester.id == entry.semester.id}"></option>
                                            </select>
                                        </div>
                                        <div class="col-6">
                                            <input class="form-control form-control-sm" name="location" th:value="${entry.location}">
                                        </div>
                                        <div class="col-12">
                                            <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
                                        </div>
                                    </form>
                                    <form class="mt-2" th:action="@{|/timetables/${entry.id}/delete|}" method="post" data-confirm="Delete this timetable entry?">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${timetablePage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{|/timetables/manage?page=${timetablePage.number-1}&size=${timetablePage.size}|}">Previous</a>
                            </li>
                            <li class="page-item disabled"><span class="page-link">Page <span th:text="${timetablePage.number + 1}">1</span> / <span th:text="${timetablePage.totalPages}">1</span></span></li>
                            <li class="page-item" th:classappend="${timetablePage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{|/timetables/manage?page=${timetablePage.number+1}&size=${timetablePage.size}|}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
