<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Approval Queue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Approval Queue</h2>
            <p class="text-muted mb-0">Moderators review each registration before granting access.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back to dashboard</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="table-responsive shadow-sm">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Student ID</th>
                <th>Requested On</th>
                <th>Assign Role</th>
                <th>Assign Cohort</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${pendingPage.content}">
                <td th:text="${user.studentId}">CB000</td>
                <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')}">Date</td>
                <td>
                    <select class="form-select form-select-sm" th:id="${'role-'+user.id}" form="approveForm__${user.id}" name="role">
                        <option value="">Default (USER)</option>
                        <option th:each="roleValue : ${roles}" th:value="${roleValue}" th:text="${roleValue}"></option>
                    </select>
                </td>
                <td>
                    <div class="row g-2">
                        <div class="col">
                            <select class="form-select form-select-sm" form="approveForm__${user.id}" name="batchId">
                                <option value="">Batch</option>
                                <option th:each="batch : ${batches}" th:value="${batch.id}" th:text="${batch.name}"></option>
                            </select>
                        </div>
                        <div class="col">
                            <select class="form-select form-select-sm" form="approveForm__${user.id}" name="semesterId">
                                <option value="">Semester</option>
                                <option th:each="semester : ${semesters}" th:value="${semester.id}" th:text="${semester.name}"></option>
                            </select>
                        </div>
                    </div>
                </td>
                <td>
                    <form th:id="${'approveForm__'+user.id}" th:action="@{|/moderator/users/${user.id}/approve|}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-success" type="submit">Approve</button>
                    </form>
                    <form th:action="@{|/moderator/users/${user.id}/reject|}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Reject</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pendingPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{|/moderator/approvals?page=${pendingPage.number-1}&size=${pendingPage.size}|}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link">Page <span th:text="${pendingPage.number + 1}">1</span> / <span th:text="${pendingPage.totalPages}">1</span></span></li>
            <li class="page-item" th:classappend="${pendingPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{|/moderator/approvals?page=${pendingPage.number+1}&size=${pendingPage.size}|}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
