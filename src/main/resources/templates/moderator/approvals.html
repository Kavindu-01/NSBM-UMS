<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Approval Queue</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container-xxl py-5">
    <div class="glass-panel p-4 p-lg-5 mb-4">
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
            <div>
                <p class="mini-chip mb-2">Moderator Desk</p>
                <h2 class="fw-bold mb-1">Approval Queue</h2>
                <p class="text-white-50 mb-0">Review each registration before granting access.</p>
            </div>
            <a class="btn btn-light-pill" th:href="@{/dashboard}">Back to Command Deck</a>
        </div>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="glass-panel">
        <div class="card-header bg-transparent border-0 px-0 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Pending Profiles</h5>
            <span class="text-white-50 small" th:text="${pendingPage.totalElements + ' awaiting review'}">0 awaiting review</span>
        </div>
        <div class="card-body px-0">
            <div class="d-flex flex-column gap-3" th:if="${pendingPage.totalElements > 0}">
                <div class="glass-panel-subtle p-4 rounded-4" th:each="user : ${pendingPage.content}">
                    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3">
                        <div>
                            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                                <p class="mini-chip mb-0" th:text="${user.studentId}">CB000</p>
                                <span class="text-white-50 small" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')}">Date</span>
                            </div>
                            <p class="text-white-50 small mb-0">Assign role & cohort before approval.</p>
                        </div>
                        <div class="d-flex gap-2">
                            <form th:action="@{|/moderator/users/${user.id}/reject|}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-soft-danger btn-sm" type="submit">Reject</button>
                            </form>
                        </div>
                    </div>
                    <form th:id="${'approveForm__'+user.id}" th:action="@{|/moderator/users/${user.id}/approve|}" method="post" class="row g-3 mt-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-md-4">
                            <label class="form-label">Role</label>
                            <select class="form-select" name="role">
                                <option value="">Default (USER)</option>
                                <option th:each="roleValue : ${roles}" th:value="${roleValue}" th:text="${roleValue}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Batch</label>
                            <select class="form-select" name="batchId">
                                <option value="">Batch</option>
                                <option th:each="batch : ${batches}" th:value="${batch.id}" th:text="${batch.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Semester</label>
                            <select class="form-select" name="semesterId">
                                <option value="">Semester</option>
                                <option th:each="semester : ${semesters}" th:value="${semester.id}" th:text="${semester.name}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-light-pill" type="submit">Approve Profile</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="glass-panel-subtle text-white-50 p-4 rounded-4" th:if="${pendingPage.totalElements == 0}">No pending registrations.</div>
        </div>
    </div>

    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pendingPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{|/moderator/approvals?page=${pendingPage.number-1}&size=${pendingPage.size}|}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link">Page <span th:text="${pendingPage.number + 1}">1</span> / <span th:text="${pendingPage.totalPages}">1</span></span></li>
            <li class="page-item" th:classappend="${pendingPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{|/moderator/approvals?page=${pendingPage.number+1}&size=${pendingPage.size}|}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
