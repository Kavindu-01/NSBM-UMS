<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Announcement CMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Announcements Control</h2>
            <p class="text-muted mb-0">Publish academic and campus alerts.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Create Announcement</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/announcements}" th:object="${announcementForm}" method="post" class="row g-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12">
                            <label class="form-label">Title</label>
                            <input class="form-control" th:field="*{title}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Content</label>
                            <textarea class="form-control" rows="4" th:field="*{content}" required></textarea>
                        </div>
                        <div class="col-12 form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{important}" id="importantFlag">
                            <label class="form-check-label" for="importantFlag">Mark as important</label>
                        </div>
                        <div class="col-12 d-grid">
                            <button class="btn btn-success" type="submit">Publish</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Recent Announcements</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Title</th>
                                <th>Important</th>
                                <th>Updated</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${announcementPage.content}">
                                <td th:text="${item.title}">Title</td>
                                <td>
                                    <span class="badge" th:classappend="${item.important} ? ' text-bg-warning' : ' text-bg-light'"
                                          th:text="${item.important ? 'YES' : 'NO'}">NO</span>
                                </td>
                                <td th:text="${#temporals.format(item.updatedAt, 'dd MMM yyyy HH:mm')}">Date</td>
                                <td>
                                    <form th:action="@{|/announcements/${item.id}/update|}" method="post" class="row g-2">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <div class="col-12">
                                            <input class="form-control form-control-sm" name="title" th:value="${item.title}" required>
                                        </div>
                                        <div class="col-12">
                                            <textarea class="form-control form-control-sm" name="content" rows="2" th:text="${item.content}" required></textarea>
                                        </div>
                                        <div class="col-12 form-check">
                                            <input class="form-check-input" type="checkbox" name="important" th:checked="${item.important}">
                                            <label class="form-check-label">Important</label>
                                        </div>
                                        <div class="col-12">
                                            <button class="btn btn-sm btn-outline-primary" type="submit">Update</button>
                                        </div>
                                    </form>
                                    <form class="mt-2" th:action="@{|/announcements/${item.id}/delete|}" method="post" data-confirm="Delete this announcement?">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${announcementPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{|/announcements/manage?page=${announcementPage.number-1}&size=${announcementPage.size}|}">Previous</a>
                            </li>
                            <li class="page-item disabled"><span class="page-link">Page <span th:text="${announcementPage.number + 1}">1</span> / <span th:text="${announcementPage.totalPages}">1</span></span></li>
                            <li class="page-item" th:classappend="${announcementPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{|/announcements/manage?page=${announcementPage.number+1}&size=${announcementPage.size}|}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
