<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Announcement Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h2 class="fw-bold" th:text="${announcement.title}">Title</h2>
            <p class="text-muted" th:text="${#temporals.format(announcement.createdAt, 'dd MMM yyyy HH:mm')}">Date</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/announcements}">Back</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <p class="lead" th:text="${announcement.content}">Content</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
