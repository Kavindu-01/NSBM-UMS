<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Announcements</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">University Announcements</h2>
            <p class="text-muted mb-0">Official communications from NSBM.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">Back</a>
    </div>
    <div class="row g-4">
        <div class="col-md-6" th:each="announcement : ${announcementPage.content}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h5 class="card-title" th:text="${announcement.title}">Title</h5>
                        <span class="badge text-bg-warning" th:if="${announcement.important}">Important</span>
                    </div>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(announcement.content, 160)}">Summary</p>
                    <p class="small text-muted" th:text="${#temporals.format(announcement.createdAt, 'dd MMM yyyy HH:mm')}">Date</p>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{|/announcements/${announcement.id}|}">Read more</a>
                </div>
            </div>
        </div>
        <div th:if="${announcementPage.totalElements == 0}" class="col-12">
            <div class="alert alert-info">No announcements available.</div>
        </div>
    </div>

    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${announcementPage.first} ? 'disabled'">
                <a class="page-link" th:href="@{|/announcements?page=${announcementPage.number-1}&size=${announcementPage.size}|}">Previous</a>
            </li>
            <li class="page-item disabled"><span class="page-link">Page <span th:text="${announcementPage.number + 1}">1</span> / <span th:text="${announcementPage.totalPages}">1</span></span></li>
            <li class="page-item" th:classappend="${announcementPage.last} ? 'disabled'">
                <a class="page-link" th:href="@{|/announcements?page=${announcementPage.number+1}&size=${announcementPage.size}|}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
