<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} + ' • NSBM University'">Something went wrong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, rgba(51,102,255,0.2), #05060a 55%);
            font-family: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="glass-panel p-4 p-lg-5 text-center error-card">
    <p class="mini-chip mb-3" th:text="${path} ?: 'Request path'">Request path</p>
    <h1 class="display-5 fw-bold mb-3" th:text="${status}">Error</h1>
    <p class="text-white-50 mb-4" th:text="${message} ?: 'Something went wrong while rendering this page.'">
        Something went wrong while rendering this page.
    </p>
    <div class="d-flex flex-column gap-2">
        <a class="btn btn-light-pill" th:href="@{/dashboard}">Back to dashboard</a>
        <a class="btn btn-ghost" th:href="@{/}">Return home</a>
    </div>
    <div class="mt-4 text-start" th:if="${error}">
        <p class="text-uppercase text-white-50 small mb-1">Details</p>
        <pre class="bg-dark text-white-50 p-3 rounded small" th:text="${error}"></pre>
    </div>
</div>
</body>
</html>
