<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Faculties</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<main class="container-xxl py-5">
    <div class="glass-panel p-4 p-lg-5 mb-4">
        <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
            <div>
                <p class="mini-chip mb-3">Academic structure</p>
                <h2 class="fw-bold mb-1">Faculties</h2>
                <p class="text-white-50 mb-0">Manage faculties and their degree programs.</p>
            </div>
            <form th:action="@{/admin/faculties}" method="post" class="d-flex flex-wrap gap-2">
                <input class="form-control" name="name" placeholder="Faculty name" required>
                <input class="form-control" name="code" placeholder="Code (e.g. FOC)" required>
                <input class="form-control" name="description" placeholder="Description">
                <button class="btn btn-light-pill" type="submit">Add Faculty</button>
            </form>
        </div>
    </div>
    <div th:replace="fragments/alerts :: alerts"></div>
    <div class="glass-panel">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Name</th>
                <th>Code</th>
                <th>Description</th>
                <th>Degrees</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="faculty : ${faculties}">
                <td th:text="${faculty.name}">Faculty Name</td>
                <td th:text="${faculty.code}">FOC</td>
                <td th:text="${faculty.description}">Description</td>
                <td><a th:href="@{|/admin/faculties/${faculty.id}/degrees|}">View Degrees</a></td>
                <td>
                    <form th:action="@{|/admin/faculties/${faculty.id}/update|}" method="post" class="d-inline-flex gap-2">
                        <input class="form-control form-control-sm" name="name" th:placeholder="${faculty.name}" required>
                        <input class="form-control form-control-sm" name="code" th:placeholder="${faculty.code}" required>
                        <input class="form-control form-control-sm" name="description" th:placeholder="${faculty.description}">
                        <button class="btn btn-sm btn-outline-success" type="submit">Update</button>
                    </form>
                    <form th:action="@{|/admin/faculties/${faculty.id}/delete|}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger ms-2" type="submit" onclick="return confirm('Delete this faculty?');">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
