<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Administrator Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div th:replace="fragments/alerts :: alerts"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Administrator Command Center</h2>
            <p class="text-muted mb-0">Welcome <span th:text="${currentUser.studentId}">CB000</span></p>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/admin/users}">Manage Users</a>
    </div>
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-uppercase text-muted small">Pending approvals</p>
                    <h3 class="fw-bold" th:text="${pendingCount}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-uppercase text-muted small">Active students</p>
                    <h3 class="fw-bold" th:text="${approvedCount}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card border-0 shadow-sm">
                <div class="card-body">
                    <p class="text-uppercase text-muted small">Rejected profiles</p>
                    <h3 class="fw-bold" th:text="${rejectedCount}">0</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Latest Announcements</h5>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/announcements}">View all</a>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(latestAnnouncements)}" class="text-muted">No announcements yet.</div>
                    <div th:each="announcement : ${latestAnnouncements}" class="mb-3">
                        <h6 class="mb-1" th:text="${announcement.title}">Announcement title</h6>
                        <p class="text-muted small" th:text="${#temporals.format(announcement.createdAt, 'dd MMM yyyy HH:mm')}">Date</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Fresh Content Highlights</h5>
                    <a class="btn btn-sm btn-outline-success" th:href="@{/content}">Explore</a>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(featuredContent)}" class="text-muted">No content published.</div>
                    <div th:each="item : ${featuredContent}" class="border-bottom pb-2 mb-2">
                        <span class="badge bg-light text-dark" th:text="${item.category}">ACADEMIC</span>
                        <h6 class="mt-2 mb-1" th:text="${item.title}">Content title</h6>
                        <p class="small text-muted" th:text="${#strings.abbreviate(item.description, 90)}">Preview</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
