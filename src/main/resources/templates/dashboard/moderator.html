<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Moderator Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div th:replace="fragments/alerts :: alerts"></div>
    <div class="mb-4">
        <h2 class="fw-bold">Moderator Operations</h2>
        <p class="text-muted">Prioritise pending approvals and keep cohorts synchronized.</p>
    </div>
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <p class="text-uppercase text-muted small">Pending approvals</p>
                    <h3 class="fw-bold" th:text="${pendingCount}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <p class="text-uppercase text-muted small">Active cohorts</p>
                    <h3 class="fw-bold" th:text="${approvedCount}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <p class="text-uppercase text-muted small">Rejected</p>
                    <h3 class="fw-bold" th:text="${rejectedCount}">0</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body d-flex flex-column flex-lg-row align-items-center justify-content-between">
            <div>
                <h5>Approval Queue</h5>
                <p class="mb-0 text-muted">Review registrations, assign batches and semesters.</p>
            </div>
            <a class="btn btn-primary mt-3 mt-lg-0" th:href="@{/moderator/approvals}">Go to approvals</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
