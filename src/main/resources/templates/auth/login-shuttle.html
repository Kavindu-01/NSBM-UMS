<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Shuttle Driver Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header text-white" style="background: linear-gradient(90deg, #0057ff, #00bcd4);">
                    <h4 class="mb-0">Shuttle Driver Access</h4>
                    <p class="mb-0 small">Stay synced with transport operations</p>
                </div>
                <div class="card-body">
                    <div th:replace="fragments/alerts :: alerts"></div>
                    <div th:if="${param.error}" class="alert alert-danger">Invalid credentials or unapproved account.</div>
                    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
                    <form th:action="@{/login}" method="post" class="mt-3">
                        <div class="mb-3">
                            <label class="form-label" for="driverId">Driver ID</label>
                            <input class="form-control" id="driverId" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="driverPassword">Password</label>
                            <input type="password" class="form-control" id="driverPassword" name="password" required>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" type="submit">Sign In</button>
                            <a class="btn btn-outline-secondary" th:href="@{/login}">Back to Student Login</a>
                        </div>
                    </form>
                    <p class="small mt-3 mb-0">Need access? <a th:href="@{/register/shuttle}">Submit a shuttle driver request</a>.</p>
                    <p class="small text-muted mt-3 mb-0">Transport ops can reset your password if required.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
