<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Shuttle Driver Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header text-white" style="background: linear-gradient(90deg, #0057ff, #00bcd4);">
                    <h4 class="mb-0">Shuttle Driver Registration</h4>
                    <p class="mb-0 small">Submit your profile so logistics can verify you</p>
                </div>
                <div class="card-body">
                    <div th:replace="fragments/alerts :: alerts"></div>
                    <form th:action="@{/register/shuttle}" th:object="${shuttleRegistrationForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{fullName}" placeholder="e.g., Mr. Sahan Fernando">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Driver ID</label>
                            <input type="text" class="form-control" th:field="*{studentId}" placeholder="e.g., SD001">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('studentId')}"
                                 th:errors="*{studentId}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Primary Contact Number</label>
                            <input type="text" class="form-control" th:field="*{contactNumber}" placeholder="e.g., +94 77 555 1234">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('contactNumber')}"
                                 th:errors="*{contactNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}"></div>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Submit for Approval</button>
                            <a class="btn btn-outline-secondary" th:href="@{/login/shuttle}">Back to Shuttle Login</a>
                        </div>
                    </form>
                    <p class="small text-muted mt-3 mb-0">Accounts remain inactive until a logistics administrator approves them.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
