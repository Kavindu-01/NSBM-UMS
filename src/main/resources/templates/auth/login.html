<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">NSBM University Management System</h4>
                    <p class="mb-0 small">Secure session-based access</p>
                </div>
                <div class="card-body">
                    <div th:replace="fragments/alerts :: alerts"></div>
                    <div th:if="${param.error}" class="alert alert-danger">Invalid credentials or unapproved account.</div>
                    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
                    <form th:action="@{/login}" method="post" class="mt-3">
                        <div class="mb-3">
                            <label for="studentId" class="form-label">Student ID or Phone Number</label>
                            <input type="text" class="form-control" id="studentId" name="username" placeholder="e.g., CB012345 or +94711234567" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Sign In</button>
                            <a class="btn btn-outline-primary" th:href="@{/register}">Need an account? Register</a>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <a class="link-secondary small" th:href="@{/forgot-password}">Forgot password?</a>
                            <a class="link-secondary small" th:href="@{/login/guardian}">Boarding guardian or shuttle driver?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
