<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Boarding Guardian Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header text-white" style="background: linear-gradient(90deg, #00a86b, #007c8c);">
                    <h4 class="mb-0">Boarding Guardian Access</h4>
                    <p class="mb-0 small">Use the credentials issued by student affairs</p>
                </div>
                <div class="card-body">
                    <div th:replace="fragments/alerts :: alerts"></div>
                    <div th:if="${param.error}" class="alert alert-danger">Invalid credentials or unapproved account.</div>
                    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
                    <form th:action="@{/login}" method="post" class="mt-3">
                        <div class="mb-3">
                            <label class="form-label" for="guardianId">Guardian ID</label>
                            <input class="form-control" id="guardianId" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="guardianPassword">Password</label>
                            <input type="password" class="form-control" id="guardianPassword" name="password" required>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-grid gap-2">
                            <button class="btn btn-success" type="submit">Sign In</button>
                            <a class="btn btn-outline-primary" th:href="@{/login}">Back to Student Login</a>
                            <a class="btn btn-outline-secondary" th:href="@{/register/guardian}">Need a Guardian Account?</a>
                        </div>
                    </form>
                    <p class="small text-muted mt-3 mb-0">Need help? Contact the boarding coordination desk.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
