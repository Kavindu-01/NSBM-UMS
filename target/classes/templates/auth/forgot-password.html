<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Password Reset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="card shadow border-0">
                <div class="card-header text-white" style="background: linear-gradient(90deg, #5f2eea, #18a4e0);">
                    <h4 class="mb-1">Reset your password</h4>
                    <p class="mb-0 small">Use your student ID / phone number plus the 6-digit recovery code you created</p>
                </div>
                <div class="card-body p-4">
                    <div th:replace="fragments/alerts :: alerts"></div>
                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Student ID or Phone Number</label>
                            <input type="text" class="form-control" th:field="*{identifier}" placeholder="e.g., CB012345 or +94711234567">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('identifier')}"
                                 th:errors="*{identifier}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Recovery Code</label>
                            <input type="text" class="form-control" th:field="*{recoveryCode}" placeholder="6-digit code" maxlength="6">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('recoveryCode')}"
                                 th:errors="*{recoveryCode}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" minlength="6" data-password-meter="Reset password"
                                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9 ]).{6,}"
                                title="Use at least 6 characters with uppercase, lowercase, number, and symbol">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" minlength="6" data-password-meter="Confirm reset password"
                                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9 ]).{6,}"
                                title="Use at least 6 characters with uppercase, lowercase, number, and symbol">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"></div>
                        </div>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-12 d-grid gap-2 mt-2">
                            <button type="submit" class="btn btn-primary">Update password</button>
                            <a class="btn btn-outline-secondary" th:href="@{/login}">Back to login</a>
                        </div>
                    </form>
                    <p class="small text-muted mt-3 mb-0">Need help? Visit Student Services with your ID card to refresh your recovery code.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
