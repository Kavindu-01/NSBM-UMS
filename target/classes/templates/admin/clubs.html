<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NSBM | Club Administration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container py-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center mb-4">
        <div>
            <h2 class="fw-bold">Clubs & Societies</h2>
            <p class="text-muted mb-0">Create clubs, assign presidents, and monitor membership growth.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Back to admin</a>
    </div>

    <div th:replace="fragments/alerts :: alerts"></div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Create a Club</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/clubs}" th:object="${clubForm}" method="post" class="row g-3" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" th:field="*{coverImageUrl}">
                        <div class="col-12">
                            <label class="form-label">Name</label>
                            <input class="form-control" th:field="*{name}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Tagline</label>
                            <input class="form-control" th:field="*{tagline}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">WhatsApp Link</label>
                            <input class="form-control" th:field="*{whatsappLink}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Cover Image</label>
                            <input type="file" class="form-control" name="coverImage" accept="image/*">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Assign President</label>
                            <select class="form-select" th:field="*{presidentId}">
                                <option value="" selected>No assignment</option>
                                <option th:each="president : ${presidents}" th:value="${president.id}" th:text="${president.studentId}"></option>
                            </select>
                        </div>
                        <div class="col-12 d-grid">
                            <button class="btn btn-primary" type="submit">Create Club</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Existing Clubs</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th>President</th>
                                <th>WhatsApp</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="club : ${clubPage.content}">
                                <td>
                                    <strong th:text="${club.name}">Name</strong>
                                    <div class="text-muted small" th:text="${club.tagline}">Tagline</div>
                                </td>
                                <td th:text="${club.president != null ? club.president.studentId : 'Unassigned'}">President</td>
                                <td>
                                    <a th:if="${club.whatsappLink != null}" th:href="${club.whatsappLink}" target="_blank">Open</a>
                                    <span th:if="${club.whatsappLink == null}" class="text-muted small">N/A</span>
                                </td>
                                <td>
                                    <div class="d-flex flex-column gap-2">
                                        <form th:action="@{|/admin/clubs/${club.id}/assign-president|}" method="post" class="d-flex gap-2">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <select class="form-select form-select-sm" name="presidentId">
                                                <option value="">Unassigned</option>
                                                <option th:each="president : ${presidents}" th:value="${president.id}" th:text="${president.studentId}" th:selected="${club.president != null and president.id == club.president.id}"></option>
                                            </select>
                                            <button class="btn btn-sm btn-outline-primary" type="submit">Assign</button>
                                        </form>
                                        <form th:action="@{|/admin/clubs/${club.id}/delete|}" method="post" onsubmit="return confirm('Delete this club?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button class="btn btn-sm btn-outline-danger w-100" type="submit">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <nav class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${clubPage.first} ? 'disabled'">
                                <a class="page-link" th:href="@{|/admin/clubs?page=${clubPage.number-1}&size=${clubPage.size}|}">Previous</a>
                            </li>
                            <li class="page-item disabled"><span class="page-link">Page <span th:text="${clubPage.number + 1}">1</span> / <span th:text="${clubPage.totalPages}">1</span></span></li>
                            <li class="page-item" th:classappend="${clubPage.last} ? 'disabled'">
                                <a class="page-link" th:href="@{|/admin/clubs?page=${clubPage.number+1}&size=${clubPage.size}|}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
